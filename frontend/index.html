<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon placeholder (asset estático que existe → sin 404). App.jsx lo
         reemplaza por el logo real del tenant apenas lo conoce. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Las fuentes se declaran en src/index.css y se sirven desde /fonts. El
         preload adelanta la de texto: sin él se descubre recién al leer el CSS. -->
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barber Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
