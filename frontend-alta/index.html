<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme.bg: la barra del navegador del celular sigue el fondo del formulario. -->
    <meta name="theme-color" content="#FAFAFA" />
    <!-- Cada link es privado (lleva el token de la solicitud): nada de esto se indexa. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Alta de tu barbería · BarberManager</title>
    <meta name="description" content="Cargá los datos de tu barbería en unos 5 minutos. Se guarda solo." />

    <!-- Vista previa al pegar el link en WhatsApp (plan §5.2). Las URLs van
         absolutas: la vista previa no resuelve rutas relativas. Una sola para
         todos los links: el token va en el path y el HTML es el mismo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BarberManager" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Armemos tu barbería" />
    <meta property="og:description" content="Cargá los datos de tu barbería en unos 5 minutos. Se guarda solo." />
    <meta property="og:image" content="https://alta.barbermanager.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BarberManager: Armemos tu barbería" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Armemos tu barbería" />
    <meta name="twitter:description" content="Cargá los datos de tu barbería en unos 5 minutos. Se guarda solo." />
    <meta name="twitter:image" content="https://alta.barbermanager.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
