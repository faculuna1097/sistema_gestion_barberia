<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Marca que hay JS antes del primer paint: las animaciones de entrada
         (.js .om-reveal en index.css) solo ocultan contenido si esta clase está.
         Sin JS, la página pre-renderizada se ve completa.
         Red de seguridad: si a los 3 s la app no hidrató (el bundle no cargó,
         tiró error o el navegador no lo soporta), se saca la clase y el
         contenido se ve sin animar. main.jsx marca window.__omHidratado. -->
    <script>
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.__omHidratado) document.documentElement.classList.remove('js');
      }, 3000);
    </script>

    <!-- SEO básico -->
    <title>BarberManager — Gestioná toda tu barbería desde un solo lugar</title>
    <meta
      name="description"
      content="Software de gestión para barberías: turnos, caja, barberos y números, todo conectado. Probá tu primer mes gratis."
    />
    <meta name="theme-color" content="#4F46E5" />

    <!-- Open Graph (preview al compartir el link) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BarberManager" />
    <meta
      property="og:title"
      content="BarberManager — Gestioná toda tu barbería desde un solo lugar"
    />
    <meta
      property="og:description"
      content="Turnos, caja, barberos y números, todo conectado. Probá tu primer mes gratis."
    />
    <meta property="og:url" content="https://barbermanager.app" />
    <meta property="og:image" content="https://barbermanager.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
